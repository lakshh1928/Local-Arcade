apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: local-arcade
spec:
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: mysql:8.0-debian
        envFrom:
        - secretRef:
            name: secret
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: db-storage
          mountPath: /var/lib/mysql
        - name: db-init-script
          mountPath: /docker-entrypoint-initdb.d/schema.sql
          subPath: schema.sql
      volumes:
      - name: db-storage
        persistentVolumeClaim:
          claimName: db-pvc
      - name: db-init-script
        configMap:
          name: db-schema

---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: local-arcade
spec:
  selector:
    app: db
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
