apiVersion: apps/v1
kind: Deployment
metadata: 
  name: nginx
  namespace: local-arcade
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: l4ksh1928/fe-la:latest
        ports:
        - containerPort: 80

--- 
apiVersion: v1
kind: Service
metadata: 
  name: nginx
  namespace: local-arcade
spec: 
  type: NodePort 
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
