apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  namespace: local-arcade
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app1
  template: 
    metadata:
      labels:
        app: app1
    spec:
      containers:
      - name: backend
        image: l4ksh1928/be-la:latest
        envFrom:
        - secretRef:
            name: secret
        ports:
        - containerPort: 8000

--- 
apiVersion: v1
kind: Service
metadata:
  name: app1
  namespace: local-arcade
spec:
  selector:
    app: app1
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
